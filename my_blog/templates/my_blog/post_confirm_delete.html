{% extends 'my_blog/base.html' %}

{% block content %}
<h2>Delete Post</h2>
<p>Are you sure you want to delete <strong>"{{ post.title }}"</strong>?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Confirm Delete</button>
</form>
<a href="{% url 'author_dashboard' %}">Cancel</a>
{% endblock %}
